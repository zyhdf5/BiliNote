name: worker-ci

on:
  push:
    branches:
      - worker
      - 'agent/**'
  pull_request:
    branches:
      - worker

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check formatting
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
      - name: Check module files
        run: |
          go mod tidy
          echo '--- go.mod after tidy ---'
          cat go.mod
          echo '--- go.sum after tidy ---'
          cat go.sum
          git diff --exit-code -- go.mod go.sum
          git ls-files --error-unmatch go.sum >/dev/null 2>&1
      - run: go test ./...
      - run: go vet ./...
