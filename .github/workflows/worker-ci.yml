name: worker-ci

on:
  push:
    branches:
      - worker
      - 'agent/**'
  pull_request:
    branches:
      - worker

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check formatting
        run: |
          test -z "$(gofmt -l cmd internal)" || { gofmt -d cmd internal; exit 1; }
      - run: go test ./...
      - run: go vet ./...
