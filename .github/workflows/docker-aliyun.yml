name: Docker

on:
  push:
    tags:
      - "v*.*.*"

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}

jobs:
  build-and-push:
    name: Build And Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: bilinote
            dockerfile: Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize registry host
        id: registry
        shell: bash
        run: |
          registry_host="${ALIYUN_REGISTRY#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          if [[ -z "$registry_host" ]]; then
            echo "ALIYUN_REGISTRY is empty or invalid" >&2
            exit 1
          fi
          echo "host=$registry_host" >> "$GITHUB_OUTPUT"

      - name: Check registry DNS
        shell: bash
        run: |
          getent hosts "${{ steps.registry.outputs.host }}" || {
            echo "Cannot resolve registry host: ${{ steps.registry.outputs.host }}" >&2
            exit 1
          }

      - name: Log in to Aliyun registry
        shell: bash
        env:
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin; then
              exit 0
            fi
            echo "docker login failed (attempt $attempt/3)" >&2
          done
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ env.ALIYUN_NAME_SPACE }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max