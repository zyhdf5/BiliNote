server:
  addr: ":8080"
  shutdown_timeout: 15s

postgres:
  dsn: "${DATABASE_URL}"

workspace:
  root: /tmp/bilinote
  stale_after: 24h

worker:
  concurrency: 2
  poll_interval: 2s
  lease_duration: 2m
  max_attempts: 3

video:
  prefer_subtitle: true
  subtitle_languages: ["zh-Hans", "zh-Hant", "zh.*", "en.*"]
  cookies_file: ""
  proxy: ""
  allow_private_urls: false
  allow_unlisted_domains: false
  allowed_domains:
    - bilibili.com
    - b23.tv
    - youtube.com
    - youtu.be
    - douyin.com
    - iesdouyin.com
    - kuaishou.com
    - tiktok.com

bilibili:
  cookie: "${BILIBILI_COOKIE}"
  request_timeout: 20s
  retries: 2
  retry_backoff: 500ms

ytdlp:
  binary: yt-dlp
  timeout: 30m
  retries: 3
  fragment_retries: 5
  concurrency: 2

ffmpeg:
  binary: ffmpeg
  timeout: 15m

asr:
  enabled: true
  base_url: "${ASR_BASE_URL}"
  api_key: "${ASR_API_KEY}"
  model: "${ASR_MODEL}"
  language: zh
  timeout: 30m
  max_retries: 2
  concurrency: 2

llm:
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL}"
  temperature: 0.2
  max_tokens: 8192
  timeout: 10m
  max_retries: 2

summary:
  chunk_chars: 30000
  map_concurrency: 4
  keep_transcript: true
