server:
  host: 0.0.0.0
  port: 8080

security:
  web_username: "${WEB_USERNAME}"
  web_password: "${WEB_PASSWORD}"

video:
  prefer_subtitle: true
  subtitle_languages:
    - zh-Hans
    - zh-Hant
    - zh.*
    - en.*
  # Netscape cookies.txt for yt-dlp authenticated extractors.
  cookies_file: ""
  request_timeout_seconds: 20
  # Application-level SSRF guard. For Internet-facing deployments, also block
  # RFC1918/link-local/cloud-metadata egress at the Docker/K8s/network layer.
  allow_private_urls: false
  # Generic arbitrary URLs are disabled by default. Add domains explicitly.
  allow_unlisted_domains: false
  allowed_domains:
    - bilibili.com
    - b23.tv
    - youtube.com
    - youtu.be
    - douyin.com
    - iesdouyin.com
    - kuaishou.com
    - tiktok.com

bilibili:
  prefer_subtitle: true
  cookie: "${BILIBILI_COOKIE}"
  request_timeout_seconds: 15
  retries: 3
  retry_backoff_seconds: 1.0

# ASR settings are restart-required. They are intentionally not hot-editable
# from the Web/API because native CTranslate2 models can remain resident on GPU.
asr:
  enabled: true
  model: large-v3
  device: cuda
  compute_type: float16
  language: zh
  beam_size: 5
  vad_filter: true
  model_dir: /models
  concurrency: 1
  preload_model: false

llm:
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL}"
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 300
  retries: 2
  retry_backoff_seconds: 1.0

summary:
  prompt_file: /app/prompts/summary.md
  chunk_chars: 24000
  parallel: 3

task:
  concurrency: 2
  max_queue_size: 20
  retain_days: 7
  cleanup_interval_seconds: 3600
  work_dir: /data/tasks
  db_path: /data/tasks.db
  download_timeout_seconds: 1800
  ffmpeg_timeout_seconds: 600
  # Soft timeout: native Whisper is allowed to finish safely before GPU release.
  task_timeout_seconds: 7200
  ytdlp_retries: 5
  ytdlp_fragment_retries: 5
  max_video_duration_seconds: 14400
  max_download_mb: 2048
  min_free_disk_gb: 2.0

system:
  startup_check: true
  fail_startup_on_error: false
  readiness_cache_seconds: 30
